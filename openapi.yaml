        Costs 5 credits.
      tags: [Cross-Domain]
      parameters:
        - $ref: '#/components/parameters/domain'
        - name: vs
          in: query
          required: true
          schema:
            type: string
          description: Competitor domain to compare against
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Maximum results to return (default 50, max 200)
      responses:
        '200':
          description: Competitor gap domains
          content:
            application/json:
              schema:
                type: object
                required: [domain, vs, data, total, returned, credits_used, credits_remaining]
                properties:
                  domain:
                    type: string
                  vs:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompetitorGapRow'
                  total:
                    type: integer
                    minimum: 0
                  returned:
                    type: integer
                    minimum: 0
                  credits_used:
                    type: integer
                    minimum: 0
                  credits_remaining:
                    type: integer
                    minimum: 0
                  crawl_release:
                    type: string
                  cached:
                    type: boolean
