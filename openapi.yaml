  /v1/sitemap:
    get:
      operationId: getSitemap
      summary: Discover and parse a domain's sitemap
      description: >
        Discovers a domain's sitemap via robots.txt, then parses and returns the URL inventory
        with lastmod, changefreq, and priority. For sitemap indexes, up to 5 child sitemaps
        are fetched in parallel. Returns empty data (not an error) when no sitemap is found.
        The legacy `/v1/url-index` route redirects here (301). Costs 2 credits.
      tags: [Page Analysis]
      parameters:
        - $ref: '#/components/parameters/domain'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Sitemap URL inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeFields'
                  - type: object
                    required: [data, total, sitemap_url, sitemap_type, child_sitemaps, source]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SitemapEntry'
                      total:
                        type: integer
                        minimum: 0
                      sitemap_url:
                        type: string
                        nullable: true
                      sitemap_type:
                        type: string
                        enum: [sitemap, index, none]
                      child_sitemaps:
                        type: array
                        items:
                          type: string
                      source:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/page-performance:
    get:
      operationId: getPagePerformance
      summary: Page performance and Core Web Vitals
      description: >
        Runs a Google PageSpeed Insights analysis and returns Lighthouse scores plus Core Web Vitals
        (LCP, CLS, TBT, FCP, Speed Index, TTI). Results are cached for 24 hours.
        Subject to a global cap of 25,000 calls/day and 50 calls/day per user.
        Costs 3 credits (deducted only on successful PSI response).
      tags: [Page Analysis]
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: The full URL to analyze
        - name: strategy
          in: query
          required: false
          schema:
            type: string
            enum: [mobile, desktop]
            default: mobile
          description: Device strategy (default mobile)
      responses:
        '200':
          description: Performance scores and Core Web Vitals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeFields'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PagePerformanceData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          description: Daily quota reached (global or per-user)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      retry_after:
                        type: string
        '503':
          description: PageSpeed Insights API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

